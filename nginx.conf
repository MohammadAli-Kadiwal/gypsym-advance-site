# ==============================================================================
# Gypsym Production Nginx Configuration
# Single-Domain Architecture: https://www.gypsym.com & https://gypsym.com
#
# PM2 Port Mapping:
#   - gypsym-web   : http://127.0.0.1:3002  (Public Root: /)
#   - gypsym-admin : http://127.0.0.1:3003  (Admin Panel: /admin)
#   - gypsym-api   : http://127.0.0.1:3004  (Core REST API: /api)
#
# Place in: /etc/nginx/sites-available/gypsym.conf
# Enable:   ln -s /etc/nginx/sites-available/gypsym.conf /etc/nginx/sites-enabled/
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Subdomain Redirect: admin.gypsym.com -> https://www.gypsym.com/admin
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.gypsym.com;
    return 301 https://www.gypsym.com/admin$request_uri;
}

# ------------------------------------------------------------------------------
# 2. Main Site: gypsym.com & www.gypsym.com (HTTP -> SSL / Reverse Proxy)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name gypsym.com www.gypsym.com;

    # Maximum file upload size for CMS images / media
    client_max_body_size 100M;

    # Performance & Network Tuning
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Proxy Buffer Tuning for High Concurrency & Large JSON Payloads
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Performance Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        image/x-icon
        font/woff
        font/woff2
        font/ttf
        font/opentype
        application/vnd.ms-fontobject;

    # 1. Core REST API (/api/v1 or /api) -> Internal Port 3004
    location /api {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # 2. Next.js Static Cache for Admin Workstation -> Internal Port 3003
    location /admin/_next/static/ {
        proxy_pass http://127.0.0.1:3003/admin/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. Admin Workstation subpath (/admin) -> Internal Port 3003
    location /admin {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Next.js Static Cache for Web App -> Internal Port 3002
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 5. Next.js Optimized Image Route Cache -> Internal Port 3002
    location /_next/image {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    }

    # 6. Static Media & Assets Cache (Images, Fonts, SVGs, Videos)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot|mp4|webm)$ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 7. Public Web Frontend (Default Root: /) -> Internal Port 3002
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
