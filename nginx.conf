# ==============================================================================
# Gypsym Production Nginx Configuration
# Domain: gypsym.com (and www.gypsym.com, admin.gypsym.com)
# Place in: /etc/nginx/sites-available/gypsym.conf
# Enable: ln -s /etc/nginx/sites-available/gypsym.conf /etc/nginx/sites-enabled/
# ==============================================================================

# ------------------------------------------------------------------------------
# OPTION A: All-in-One Single Domain (gypsym.com)
# Main Site: gypsym.com
# Admin:     gypsym.com/admin
# API:       gypsym.com/api
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name gypsym.com www.gypsym.com;

    # Maximum file upload size for CMS images / media
    client_max_body_size 100M;

    # Performance Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. Backend REST API (/api/v1 or /api) -> Port 4000
    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # 2. Admin Portal (/admin) -> Port 3001
    location /admin {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Next.js Static Cache for Web App
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # 4. Public Web Frontend (Default Root) -> Port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# OPTION B: Dedicated Admin Subdomain (admin.gypsym.com) [Optional & Recommended]
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.gypsym.com;

    client_max_body_size 100M;
    gzip on;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
