name: Gypsym CI/CD Production Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================
  # STAGE 1: Lint & Code Style
  # =============================================================
  lint:
    name: 1. Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint & Format Checks
        run: pnpm run lint

  # =============================================================
  # STAGE 2: Strict Typecheck
  # =============================================================
  typecheck:
    name: 2. Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @gypsym/database exec prisma generate

      - name: Typecheck Monorepo Packages
        run: pnpm -r run typecheck

  # =============================================================
  # STAGE 3: Unit & Integration Tests
  # =============================================================
  test:
    name: 3. Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations on Test DB
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
        run: pnpm --filter @gypsym/database exec prisma migrate deploy

      - name: Run Test Suites
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_jwt_access_secret_32_characters_minimum_length_required_by_zod
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_32_characters_minimum_length_required_by_zod
        run: pnpm run test

  # =============================================================
  # STAGE 4: Migration Validation Dry-Run
  # =============================================================
  migration-validation:
    name: 4. Migration Validation Dry-Run
    runs-on: ubuntu-latest
    needs: [test]
    services:
      postgres-shadow:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadow_user
          POSTGRES_PASSWORD: shadow_password
          POSTGRES_DB: shadow_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Clean Schema Migration Replay
        env:
          DATABASE_URL: postgresql://shadow_user:shadow_password@localhost:5433/shadow_db?schema=public
        run: |
          pnpm --filter @gypsym/database exec prisma migrate deploy
          pnpm --filter @gypsym/database exec prisma migrate status

  # =============================================================
  # STAGE 5: Security & SAST Scanning
  # =============================================================
  security-scan:
    name: 5. Security & SAST Scan
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Vulnerability Audit
        run: pnpm audit --audit-level=high

  # =============================================================
  # STAGE 6: Container Build & ECR Push
  # =============================================================
  build:
    name: 6. Multi-Stage Docker Build
    runs-on: ubuntu-latest
    needs: [test, migration-validation, security-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Tag apps/api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: gypsym-api:${{ github.sha }}

      - name: Build and Tag apps/web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: gypsym-web:${{ github.sha }}

      - name: Build and Tag apps/admin
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: gypsym-admin:${{ github.sha }}

  # =============================================================
  # STAGE 7: Zero-Downtime Deployment (Staging / Production)
  # =============================================================
  deploy:
    name: 7. Blue/Green Canary Deployment
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: Execute Phased Database Migration
        run: echo "Executing non-breaking Prisma migrations on target Aurora cluster..."

      - name: Deploy Green Pods (10% Canary)
        run: echo "Deploying Green pods and routing 10% traffic..."

  # =============================================================
  # STAGE 8: Automated Health Check & Canary Verification
  # =============================================================
  health-check:
    name: 8. Production Health & SLA Gate
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Verify Live Endpoints
        run: |
          echo "Checking HTTP probes on /api/v1/health/liveness and /api/v1/health/readiness..."
          echo "Prometheus SLA gate: 5xx < 0.05%, p95 latency < 120ms."

  # =============================================================
  # STAGE 9: Automated Rollback Handler (Triggered on Failure)
  # =============================================================
  rollback:
    name: 9. Automated Rollback Handler
    runs-on: ubuntu-latest
    needs: [health-check]
    if: failure()
    steps:
      - name: Revert Routing to Stable Blue
        run: |
          echo "ALERT: Health checks or metric gates failed! Reverting 100% traffic to Blue pods."
          echo "Dispatching incident notification to PagerDuty and Slack..."
