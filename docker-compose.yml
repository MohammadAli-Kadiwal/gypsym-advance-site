version: '3.8'

services:
  # -------------------------------------------------------------
  # INFRASTRUCTURE SERVICES
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: gypsym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gypsym_user
      POSTGRES_PASSWORD: gypsym_password
      POSTGRES_DB: gypsym_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gypsym_user -d gypsym_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gypsym-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # BACKEND REST API
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gypsym-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://gypsym_user:gypsym_password@postgres:5432/gypsym_db?schema=public
      JWT_ACCESS_SECRET: dev_jwt_access_secret_32_characters_minimum_length_required_by_zod
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_32_characters_minimum_length_required_by_zod
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '4000:4000'

  # -------------------------------------------------------------
  # PUBLIC WEBSITE (apps/web)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gypsym-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - '3000:3000'

  # -------------------------------------------------------------
  # ADMIN WORKSTATION (apps/admin)
  # -------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: gypsym-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://api:4000/api/v1
    ports:
      - '3001:3001'

volumes:
  postgres_data:
  redis_data:
